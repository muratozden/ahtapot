name: ahtapot

services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ahtapot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ahtapot}
      POSTGRES_DB: ahtapot
      # Empty lets timescaledb-tune size itself from host memory; set a cap on shared hosts.
      TS_TUNE_MEMORY: ${TS_TUNE_MEMORY:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahtapot -d ahtapot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
